name: Prepare build
description: Restore packages, drop the Website project from the solution and import the manifest signing certificate.

inputs:
  pfx-base64:
    description: Base64 of the signing certificate (pfx); the import is skipped when empty
    required: false
    default: ''
  pfx-password:
    description: Password of the pfx
    required: false
    default: ''
  require-signing:
    description: Fail the build when the signing certificate is not provided
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: microsoft/setup-msbuild@v2

    # The Website project targets .NET Framework 4.0, which fails on modern runners
    - name: Remove Website project from solution
      shell: pwsh
      run: |
        $content = Get-Content NavfertyExcelAddIn.slnx -Raw
        $content = $content -replace '(?s)\s*<Project Path="Website/".*?</Project>', ''
        Set-Content NavfertyExcelAddIn.slnx $content -NoNewline

    - name: Require signing certificate
      if: inputs.require-signing == 'true' && (inputs.pfx-base64 == '' || inputs.pfx-password == '')
      shell: pwsh
      run: throw 'Signing certificate secrets are required but not available'

    - name: Import signing certificate
      if: inputs.pfx-base64 != ''
      shell: pwsh
      env:
        PFX_BASE64: ${{ inputs.pfx-base64 }}
        PFX_PASSWORD: ${{ inputs.pfx-password }}
      run: |
        $pfxPath = Join-Path $PWD 'NavfertyExcelAddIn/Navferty.pfx'
        [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:PFX_BASE64))
        $secure = ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force
        $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $secure
        Write-Host "Imported certificate, thumbprint: $($cert.Thumbprint)"

    # VSTO builds cannot be unsigned, so CI signs with a throwaway self-signed certificate
    - name: Create disposable signing certificate
      if: inputs.pfx-base64 == ''
      shell: pwsh
      run: |
        $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=CI Disposable' -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddDays(1)
        $password = ConvertTo-SecureString ([guid]::NewGuid().ToString()) -AsPlainText -Force
        Export-PfxCertificate -Cert $cert -FilePath (Join-Path $PWD 'NavfertyExcelAddIn/Navferty.pfx') -Password $password | Out-Null
        "CI_CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

    - name: Restore
      shell: pwsh
      run: msbuild NavfertyExcelAddIn.slnx /t:Restore /p:Configuration=Release /verbosity:minimal
