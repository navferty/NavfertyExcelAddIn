name: Website

# Deploys only the static website; the add-in is neither built nor deployed here
on:
  push:
    branches: [master]
    paths:
      - Website/**
      - scripts/build-website.sh
      - scripts/verify-hugo.py
      - scripts/test-hugo-output.py
      - scripts/test-hugo-search.js
      - .github/workflows/website.yml

permissions:
  contents: read

# Shared with the release workflow so both never write to the server at the same time
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      WWW_DIR: /opt/navferty_net/www/
      SITE_DIR: ${{ runner.temp }}/website
    steps:
      - uses: actions/checkout@v4

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.123.7'
          extended: true

      - name: Build and verify Hugo site
        run: bash scripts/build-website.sh "$SITE_DIR"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SSH_HOST_KEY: ${{ secrets.SSH_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          [ -n "$SSH_HOST_KEY" ] || { echo 'SSH_HOST_KEY secret is required'; exit 1; }
          printf '%s %s\n' "$SERVER_HOST" "$(printf '%s' "$SSH_HOST_KEY" | awk '{print $1, $2}')" > ~/.ssh/known_hosts

      # Fails fast unless the target directory already exists
      - name: Check target directory
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "$SERVER_USER@$SERVER_HOST" \
            'test -d "/opt/navferty_net/www"'

      # The generated Hugo directory is the complete website; remove obsolete legacy pages.
      - name: Deploy Hugo site to www
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          rsync -rltvz --delete-delay --no-perms --no-owner --no-group \
            -e "ssh -i $HOME/.ssh/id_deploy -o StrictHostKeyChecking=yes" \
            "$SITE_DIR/" "$SERVER_USER@$SERVER_HOST:$WWW_DIR"
