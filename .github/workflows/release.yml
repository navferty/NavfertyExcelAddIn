name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    environment: production
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $base = '${{ github.event.release.tag_name }}'.TrimStart('v')
          if ($base -notmatch '^(\d+)\.(\d+)\.(\d+)') { throw "Cannot parse version from '$base'" }
          $version = "$($Matches[1]).$($Matches[2]).$($Matches[3]).${{ github.run_number }}"
          Write-Host "Version: $version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - uses: ./.github/actions/prepare-build
        with:
          pfx-base64: ${{ secrets.CERT_PFX_BASE64 }}
          pfx-password: ${{ secrets.CERT_PASSWORD }}

      - name: Build
        run: >
          msbuild NavfertyExcelAddIn.slnx /m /p:Configuration=Release /p:Platform="Any CPU"
          /p:Version="${{ steps.version.outputs.version }}" /verbosity:minimal

      # setup.exe signing may fail, which is expected: setup.exe is not deployed
      - name: Publish ClickOnce
        continue-on-error: true
        run: >
          msbuild NavfertyExcelAddIn/NavfertyExcelAddIn.csproj /t:PublishOnly
          /p:Version="${{ steps.version.outputs.version }}"
          /p:ApplicationVersion="${{ steps.version.outputs.version }}"
          /p:PublishDir="${{ runner.temp }}\staging\"
          /p:InstallUrl="https://deploy.navferty.net/"
          /p:VisualStudioVersion="17.0" /p:Platform=AnyCPU /p:Configuration=Release
          /p:BootstrapperEnabled=true /p:CreateWebPageOnPublish=true /verbosity:normal

      - name: Verify publish output
        shell: pwsh
        run: |
          $dst = '${{ runner.temp }}\staging'
          Get-ChildItem $dst -Recurse -File | Format-Table FullName, Length
          if (-not (Get-ChildItem $dst -Filter *.vsto)) { throw '.vsto manifest not found' }
          foreach ($arch in 'x86', 'x64') {
            if (-not (Get-ChildItem $dst -Filter 'SQLite.Interop.dll*' -Recurse | Where-Object { $_.FullName -like "*\$arch\*" })) {
              throw "SQLite.Interop.dll ($arch) not found"
            }
          }
          Get-ChildItem $dst -Include *.vsto, *.manifest -Recurse | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            Write-Host "$($_.Name): $($sig.Status) $($sig.SignerCertificate.Subject)"
          }

      - name: Export public certificate
        shell: pwsh
        env:
          PFX_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          $cert = [Security.Cryptography.X509Certificates.X509Certificate2]::new((Resolve-Path 'NavfertyExcelAddIn/Navferty.pfx').Path, $env:PFX_PASSWORD)
          [IO.File]::WriteAllBytes('${{ runner.temp }}\staging\NavfertyCert.cer', $cert.Export('Cert'))
          Write-Host "Exported $($cert.Subject) $($cert.Thumbprint)"

      - uses: actions/upload-artifact@v4
        with:
          name: InstallationFiles
          path: ${{ runner.temp }}\staging
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: Website
          path: Website
          if-no-files-found: error

      - name: Remove signing certificate file
        if: always()
        shell: pwsh
        run: Remove-Item NavfertyExcelAddIn/Navferty.pfx -Force -ErrorAction SilentlyContinue

  attach-release-assets:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: InstallationFiles
          path: staging
      - name: Zip and attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd staging && zip -qr ../NavfertyExcelAddIn-${{ needs.build.outputs.version }}.zip .)
          gh release upload "${{ github.event.release.tag_name }}" NavfertyExcelAddIn-*.zip --clobber --repo "${{ github.repository }}"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    env:
      WWW_DIR: web/navferty_net/www/
      DEPLOY_DIR: web/navferty_net/deploy/
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: InstallationFiles
          path: install
      - uses: actions/download-artifact@v4
        with:
          name: Website
          path: website

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      # Fails fast unless both target directories already exist
      - name: Check target directories
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy "$SERVER_USER@$SERVER_HOST" \
            'test -d "$HOME/web/navferty_net/www" && test -d "$HOME/web/navferty_net/deploy"'

      - name: Upload website to www
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          flags=(-rltvz --no-perms --no-owner --no-group --exclude='deploy/')
          rsync "${flags[@]}" -e "ssh -i $HOME/.ssh/id_deploy" \
            website/ "$SERVER_USER@$SERVER_HOST:$WWW_DIR"

      # setup.exe is intentionally not deployed
      - name: Upload installation files to deploy
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          flags=(-rltvz --no-perms --no-owner --no-group --prune-empty-dirs)
          for ext in dll pdb config deploy manifest vsto cer htm; do flags+=(--include="*.$ext"); done
          flags+=(--include='*/' --exclude='*')
          rsync "${flags[@]}" -e "ssh -i $HOME/.ssh/id_deploy" \
            install/ "$SERVER_USER@$SERVER_HOST:$DEPLOY_DIR"
